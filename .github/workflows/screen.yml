name: AlphaSift Stock Screening

on:
  schedule:
    # 每个工作日（周一至周五）北京时间 15:30 自动运行
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 允许你随时手动点击 Run workflow 触发

jobs:
  screen:
    runs-on: ubuntu-24.04 # 锁定稳定的系统版本，避开环境频繁变动

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Pipx and Poetry
      run: |
        pip install --user pipx
        python3 -m pipx ensurepath
        pipx install poetry
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        poetry install

    - name: Run AlphaSift Screening
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        poetry run alphasift screen volume_breakout --post-analyzer dsa
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        DSA_API_URL: ${{ secrets.DSA_API_URL }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
