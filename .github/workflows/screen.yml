name: AlphaSift Stock Screening

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch: 

jobs:
  screen:
    runs-on: ubuntu-24.04 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Pipx and Poetry
      run: |
        pip install --user pipx
        python3 -m pipx ensurepath
        pipx install poetry
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        poetry install

    - name: Run AlphaSift Screening
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        poetry run alphasift screen volume_breakout
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        # 显式指定各大邮箱服务器的配置，强制开启安全连接，防范漏信
        EMAIL_SMTP_HOST: ://qq.com       # 如果你用的是163邮箱，请改成 ://163.com
        EMAIL_SMTP_PORT: 465               # 大多数国内邮箱加密端口都是 465
